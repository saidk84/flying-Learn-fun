<body><div id="app"><header class="top"><button class="brand" id="brand" aria-label="Flying home"><span class="brand-icon">✈️</span><span>Flying<small>LEARN &amp; FUN</small></span></button><div class="top-actions"><span class="pill" id="totalStars">⭐ 0</span><button class="iconbtn" id="settingsButton" aria-label="Settings">⚙</button></div></header><main id="main"></main><footer id="footer">Little flights. Big discoveries. <span>Made for curious minds ♡</span></footer></div><dialog id="modal"></dialog><div id="confetti" aria-hidden="true"></div><script>/* Aviation curriculum, aircraft, modes and score rules. */
const Learning=(()=>{
 const item=(id,label,glyph,color)=>({id,label,glyph:glyph||label,color});
 const worlds=[
  {id:'aircraft',name:'Aircraft Hangar',topic:'Aircraft',icon:'✈️',color:'#e9e0ff',description:'Meet drones, jets, helicopters and planes',items:[['drone','Quadcopter drone','🛸'],['fpv','FPV racing drone','🚁'],['helicopter','Helicopter','🚁'],['glider','Glider','🪂'],['biplane','Biplane','🛩️'],['propeller','Propeller plane','✈️'],['seaplane','Seaplane','🛥️'],['cargo','Cargo plane','📦'],['passenger','Passenger jet','🛫'],['fighter','Fighter jet','🛩️'],['supersonic','Supersonic jet','💨'],['hotair','Hot-air balloon','🎈']].map(([id,label,g])=>item(id,label,g))},
  {id:'sky',name:'Sky & Weather',topic:'Sky',icon:'☁️',color:'#dceffc',description:'Explore clouds, wind and sunshine',items:[['sun','Sun','☀️'],['cloud','Cloud','☁️'],['rain','Rain','🌧️'],['rainbow','Rainbow','🌈'],['wind','Wind','💨'],['storm','Storm','⛈️'],['snow','Snow','❄️'],['moon','Moon','🌙'],['star','Star','⭐'],['fog','Fog','🌫️'],['blue-sky','Blue sky','🩵'],['sunset','Sunset','🌇']].map(([id,label,g])=>item(id,label,g))},
  {id:'aviation',name:'Pilot Basics',topic:'Aviation',icon:'🧭',color:'#def3db',description:'Learn the parts and ideas pilots use',items:[['wing','Wing','🪽'],['tail','Tail fin','🔺'],['engine','Engine','⚙️'],['propeller','Propeller','🌀'],['cockpit','Cockpit','🎛️'],['runway','Runway','🛣️'],['airport','Airport','🏢'],['pilot','Pilot','👩‍✈️'],['compass','Compass','🧭'],['altitude','Altitude','📈'],['fuel','Fuel','⛽'],['landing','Landing','🛬']].map(([id,label,g])=>item(id,label,g))},
  {id:'numbers',name:'Number Clouds',topic:'Numbers',icon:'123',color:'#ffe1eb',description:'Count clouds, planes and stars',items:Array.from({length:20},(_,i)=>item(String(i+1),String(i+1),String(i+1)))},
  {id:'colors',name:'Color Skies',topic:'Colors',icon:'🎨',color:'#ffe9ce',description:'Spot bright colors in the sky',items:[['red','#ef636b'],['blue','#528de0'],['yellow','#f5cf42'],['green','#54b786'],['orange','#f79b4b'],['purple','#a07cdb'],['pink','#ed91b7'],['white','#ffffff'],['silver','#a9b5c5'],['black','#36415b']].map(([c,h])=>item(c,c,'●',h))}
 ];
 for(const w of worlds)for(const it of w.items){it.category=w.id;it.voiceKey=w.id+'-'+it.id;}
 const mixed={id:'mixed',name:'Cloud Nine Mix',topic:'Everything',icon:'🌤️',color:'#e7e8ff',description:'Planes, weather, numbers and pilot basics',items:worlds.flatMap(w=>w.items)};
 const seniorWorld={id:'space',name:'Space Flight',topic:'Space',icon:'🚀',color:'#d9d3f5',description:'Fly among planets, satellites and stars',items:[['rocket','Rocket','🚀'],['satellite','Satellite','🛰️'],['planet','Planet','🪐'],['moon','Moon','🌙'],['star','Star','⭐'],['astronaut','Astronaut','🧑‍🚀'],['comet','Comet','☄️'],['galaxy','Galaxy','🌌'],['mars','Mars','🔴'],['earth','Earth','🌍'],['station','Space station','🛸'],['nebula','Nebula','🌠']].map(([id,label,g])=>item(id,label,g))};
 for(const it of seniorWorld.items){it.category='space';it.voiceKey='space-'+it.id;}
 const aircraft=[['skyhopper','Sky Hopper','#ffd264','drone','🛸'],['swift','Swift FPV','#ef8cae','drone','🚁'],['cloudwing','Cloudwing','#74c9eb','prop','🛩️'],['sunbeam','Sunbeam Glider','#86cdb0','glider','🪂'],['jetstream','Jetstream','#b5a0e6','jet','✈️'],['bluebird','Bluebird Airliner','#5ba3cf','airliner','🛫'],['thunder','Thunder Jet','#e97673','fighter','🛩️'],['seafarer','Sea Skimmer','#f8a36e','seaplane','🛥️'],['starlight','Starlight Cargo','#cfade3','cargo','📦'],['helios','Helios Helicopter','#a3c87b','helicopter','🚁']].map(([id,name,color,shape,glyph])=>({id,name,color,shape,glyph}));
 const modes=[{id:'preschool',name:'Little Flyers',age:'3+',unlockStars:1,icon:'🌱',description:'Gentle clues and happy practice'},{id:'mixed',name:'Cloud Nine Mix',age:'ALL',unlockStars:1,icon:'🌤️',description:'All five topics in one flight'},{id:'challenge',name:'Pilot Challenge',age:'7+',unlockStars:2,icon:'🧠',description:'Sequences, logic and number missions'},{id:'senior',name:'Space Flyers',age:'13+',unlockStars:2,icon:'🚀',description:'Space collection at top speed'},{id:'free',name:'Free Flight',age:'ALL',unlockStars:0,icon:'🛩️',description:'Fly, collect and explore'}];
 const levelCount=()=>60;
 function plan(world,level,mode='preschool'){const safeLevel=Math.max(1,Math.min(60,level)),round=Math.floor((safeLevel-1)/20),group=world.id==='mixed'?safeLevel-1:(safeLevel-1)%20,size=5;let pool=Array.from({length:size},(_,j)=>world.items[(group*size+j)%world.items.length]);let targets=Array.from({length:10},(_,i)=>pool[(i+round+group)%pool.length]);if(world.id==='mixed'){targets=Array.from({length:10},(_,i)=>{const topic=worlds[i%worlds.length],practice=Math.floor(i/worlds.length),index=((safeLevel-1)*2+practice)%topic.items.length;return topic.items[index];});pool=world.items;}const speed=mode==='senior'?Math.max(.42,.82-safeLevel*.006):mode==='challenge'?Math.max(1.8,3.5-safeLevel*.022):Math.max(3.1,5-round*.65);return {pool,round,targets,seconds:speed,mode,activity:mode==='challenge'?['collect','logic','math'][safeLevel%3]:mode==='senior'?'hunt':'match',level:safeLevel};}
 function result(correct,wrong,missed,mode='preschool'){const attempts=correct+wrong+missed,accuracy=attempts?correct/attempts:0,thresholds=mode==='challenge'?[.65,.8,.95]:mode==='senior'?[.7,.85,.95]:[.5,.7,.9];const stars=accuracy>=thresholds[2]?3:accuracy>=thresholds[1]?2:accuracy>=thresholds[0]?1:0;return {accuracy:Math.round(accuracy*100),score:Math.round(accuracy*1000),stars,starCriteria:thresholds.map(n=>Math.round(n*100))};}
 return {worlds,mixed,seniorWorld,aircraft,modes,levelCount,plan,result};
})();if(typeof module!=='undefined')module.exports=Learning;</script><script>const VOICE={};</script><script>'use strict';
const $=s=>document.querySelector(s),main=$('#main'),modal=$('#modal');
let save={aircraft:'skyhopper',sound:true,voice:true,slow:false,progress:{}};
try{const old=JSON.parse(localStorage.getItem('flying-learn-fun-v1'));if(old&&typeof old==='object')save={...save,...old,progress:old.progress||{}};}catch{}
if(!Learning.aircraft.some(a=>a.id===save.aircraft))save.aircraft='skyhopper';
let screen='home',world=Learning.worlds[0],level=1,game=null,audioContext,voiceAudio=null,lastTime=0,garageDestination='home',activeMode='preschool';
const aircraft=()=>Learning.aircraft.find(a=>a.id===save.aircraft),key=()=>activeMode+':'+world.id+':'+level;
function progress(){save.progress2 ||= {};return save.progress2;}
function persist(){try{localStorage.setItem('flying-learn-fun-v1',JSON.stringify(save));}catch{}}
function totalStars(){return [...Object.values(save.progress),...Object.values(progress())].reduce((n,p)=>n+(Number(p.stars)||0),0);}
function updateHeader(){$('#totalStars').textContent='⭐ '+totalStars();}
function audioReady(){try{audioContext ||= new(window.AudioContext||window.webkitAudioContext)();audioContext.resume();}catch{}}
function tone(type){if(!save.sound)return;audioReady();if(!audioContext)return;const seq=type==='wrong'?[180,140]:type==='combo'?[494,587,698,880]:type==='win'?[494,587,698,880,698,880]:[587,740];seq.forEach((f,i)=>{const o=audioContext.createOscillator(),g=audioContext.createGain(),t=audioContext.currentTime+i*.105;o.type=type==='wrong'?'triangle':'sine';o.frequency.value=f;g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.075,t+.025);g.gain.exponentialRampToValueAtTime(.0001,t+.18);o.connect(g);g.connect(audioContext.destination);o.start(t);o.stop(t+.2);});}
function silence(){if(voiceAudio){voiceAudio.pause();voiceAudio=null;}}
function speak(id){silence();if(!save.voice)return;const text=VOICE?.[id];if(text){voiceAudio=new Audio(text);voiceAudio.volume=.48;voiceAudio.play().catch(()=>{});}else if('speechSynthesis'in window){const u=new SpeechSynthesisUtterance((id||'').split('-').slice(1).join(' ').replaceAll('-',' '));u.lang='en-US';u.rate=.9;speechSynthesis.speak(u);}}
function setScreen(name){silence();screen=name;document.body.classList.toggle('playing',name==='race');main.innerHTML='';window.scrollTo(0,0);updateHeader();}
function home(){game=null;setScreen('home');const visible=activeMode==='senior'?[Learning.seniorWorld]:['mixed','free'].includes(activeMode)?[Learning.mixed]:Learning.worlds;const m=Learning.modes.find(x=>x.id===activeMode);main.innerHTML=`<section class="hero"><div><div class="eyebrow">Little flights. Big discoveries.</div><h1>Ready to<br><em>fly &amp; learn!</em></h1><p>Choose your aircraft. Follow the sky clues. Every mission brings a new discovery.</p><div class="btnrow"><button class="btn primary" id="play">Let's fly <span>→</span></button></div></div><div class="hero-art" aria-hidden="true"><div class="sky-path"></div><div class="hero-plane">${aircraft().glyph}</div><div class="float a">☁️</div><div class="float b">🛸</div><div class="float c">⭐ 3</div></div></section><div class="features"><span>✓ Ages 3+</span><span>♡ No ads. Just fun.</span><span>✦ Learn at your pace</span></div><div class="section-title"><h2>${activeMode==='free'?'Free Flight · explore at your own pace':'Choose your flight'}</h2><small>${m.name} · ${m.age}</small></div><div class="mode-list">${Learning.modes.map(x=>`<button class="mode-card ${x.id===activeMode?'chosen':''}" data-mode="${x.id}"><span>${x.icon}</span><b>${x.name}</b><small>${x.age} · ${x.description}</small></button>`).join('')}</div><div class="worlds">${visible.map(w=>{const stars=Object.entries(progress()).filter(([k])=>k.startsWith(activeMode+':'+w.id+':')).reduce((n,[,p])=>n+(p.stars||0),0);return `<button class="world" data-world="${w.id}"><span class="world-art" style="background:${w.color}">${w.icon}</span><span class="world-info"><b>${w.name}</b><small>${w.description}</small><span class="world-progress"><span class="track"><i style="width:${stars/180*100}%"></i></span>${activeMode==='free'?'One minute · explore freely':`60 missions · ${stars} stars`}</span></span><span class="arrow">›</span></button>`;}).join('')}</div><div class="garage-strip"><span class="craft">${aircraft().glyph}</span><div><b>Your flight, your aircraft</b><p>10 aircraft to choose from. Which one is you?</p></div><button class="btn" id="garage">Hangar →</button></div>`;
$('#play').onclick=()=>garage('worlds');$('#garage').onclick=()=>garage('home');main.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{activeMode=b.dataset.mode;if(activeMode==='free')garage('free');else home();});main.querySelectorAll('[data-world]').forEach(b=>b.onclick=()=>{world=visible.find(w=>w.id===b.dataset.world);activeMode==='free'?startFree():levels();});}
function garage(destination='home'){garageDestination=destination;setScreen('garage');main.innerHTML=`<button class="back" id="back">← Back</button><div class="pagehead"><div class="eyebrow">Welcome to the hangar</div><h1>Choose your aircraft</h1><p>Drones, jets, planes and more — ready for takeoff.</p></div><div class="crafts">${Learning.aircraft.map(a=>`<button class="craft-option ${a.id===save.aircraft?'selected':''}" data-aircraft="${a.id}" aria-pressed="${a.id===save.aircraft}"><span class="craft">${a.glyph}</span><b style="color:${a.color}">${a.name}</b><small>${a.shape}</small></button>`).join('')}</div><div class="btnrow"><button class="btn primary" id="choose">Fly with ${aircraft().name} →</button></div>`;$('#back').onclick=home;main.querySelectorAll('[data-aircraft]').forEach(b=>b.onclick=()=>{save.aircraft=b.dataset.aircraft;persist();tone('correct');garage(destination);});$('#choose').onclick=()=>destination==='free'?startFree():home();}
function levels(){game=null;setScreen('levels');main.innerHTML=`<button class="back" id="back">← Flight routes</button><div class="pagehead"><div class="world-art" style="background:${world.color};margin:auto">${world.icon}</div><h1>${world.name}</h1><p>Find the target. Take your time. Try again anytime.</p></div>${[0,1,2].map(round=>`<h2 class="round-label">${['🌱 Discover','🌤️ Practice','🏆 Shine'][round]} <span class="notice">· ${['a gentle start','meet them again','a little quicker'][round]}</span></h2><div class="level-grid">${Array.from({length:20},(_,i)=>{const n=round*20+i+1,p=progress()[activeMode+':'+world.id+':'+n],unlocked=n===1||progress()[activeMode+':'+world.id+':'+(n-1)]?.stars>=Learning.modes.find(m=>m.id===activeMode).unlockStars;return `<button class="level ${p?'done':''} ${unlocked&&!p?'current':''}" data-level="${n}" ${unlocked?'':'disabled'}>${unlocked?n:'🔒'}<small>${p?'★'.repeat(p.stars)+'☆'.repeat(3-p.stars):unlocked?'Fly!':'Soon'}</small></button>`;}).join('')}</div>`).join('')}<p class="notice">10 targets per mission. Earn stars to unlock the next flight. Every try helps you learn.</p>`;$('#back').onclick=home;main.querySelectorAll('[data-level]').forEach(b=>b.onclick=()=>start(Number(b.dataset.level)));}
function start(n,mode=activeMode){audioReady();activeMode=mode;level=n;const plan=Learning.plan(world,n,mode);game={plan,index:0,correct:0,wrong:0,missed:0,combo:0,bestCombo:0,lane:1,paused:false,phase:'prompt',wait:2.6,elapsed:0,choices:[],target:plan.targets[0]};setScreen('race');main.innerHTML=`<section class="game-shell"><div class="game-top"><button class="iconbtn" id="quit">←</button><div><b>${world.name}</b><small>Mission ${level} · ${aircraft().name}</small></div><button class="iconbtn" id="pause">Ⅱ</button></div><div class="hud"><div>ACCURACY<b id="accuracy">—</b></div><div>SCORE<b id="score">0</b></div><div>COMBO<b id="combo">0 ✦</b></div><div>TARGETS<b id="count">0 / 10</b></div></div><div class="objective"><div class="target-glyph" id="targetGlyph"></div><div><p id="targetHint">FLIGHT MISSION</p><strong id="targetLabel"></strong></div><button class="iconbtn" id="repeat" aria-label="Hear target">♪</button></div><div class="flight" id="flight" aria-label="Three-lane sky. Steer with arrows or touch"><div class="flight-path"></div><div class="player" id="player"><span class="craft">${aircraft().glyph}</span></div><div class="feedback" id="feedback">Ready for takeoff!<small>Steer into the matching flight lane</small></div></div><div class="progress-line"><i id="progress"></i></div><div class="controls"><button id="left">←</button><p>Tap a sky lane, swipe, or use arrows<br>Collect only the target!</p><button id="right">→</button></div><span id="announcement" class="sr-only" aria-live="polite"></span></section>`;
$('#left').onclick=()=>steer(game.lane-1);$('#right').onclick=()=>steer(game.lane+1);$('#pause').onclick=pause;$('#quit').onclick=()=>pause(true);$('#repeat').onclick=()=>{game.wait=Math.max(game.wait,2.2);speak(targetAudio());};let x=0;$('#flight').onpointerdown=e=>x=e.clientX;$('#flight').onpointerup=e=>{if(Math.abs(e.clientX-x)>25)steer(game.lane+(e.clientX>x?1:-1));else{const r=$('#flight').getBoundingClientRect();steer(Math.floor(((e.clientX-r.left)/r.width-.13)/(.74/3)));}};prompt();}
function targetAudio(){return game.target.voiceKey||world.id+'-'+game.target.id;}
function prompt(){game.target=game.plan.targets[game.index%game.plan.targets.length];$('#targetGlyph').innerHTML=game.target.color?`<span style="color:${game.target.color}">●</span>`:game.target.glyph;$('#targetLabel').textContent=game.target.label;$('#targetHint').textContent=activeMode==='challenge'?'PILOT CHALLENGE · '+(game.plan.activity==='math'?'NUMBER MISSION':game.plan.activity==='logic'?'FLIGHT LOGIC':'COLLECT IN ORDER'):activeMode==='senior'?'SPACE FLIGHT · COLLECT THE TARGET':game.target.category.toUpperCase()+' · FIND THIS';$('#announcement').textContent='Find '+game.target.label;speak(targetAudio());}
function steer(lane){if(!game||game.paused||screen!=='race')return;game.lane=Math.max(0,Math.min(2,lane));$('#player').style.left=(17.83+game.lane*24.67)+'%';}
function spawn(){const target=game.target;let pool=game.plan.pool.filter(i=>i.id!==target.id);if(pool.length<2)pool=world.items.filter(i=>i.id!==target.id);pool=[...pool].sort(()=>Math.random()-.5);const choices=[target,...pool.slice(0,2)];for(let i=2;i>0;i--){const j=Math.floor(Math.random()*(i+1));[choices[i],choices[j]]=[choices[j],choices[i]];}game.choices=choices;game.elapsed=0;game.phase='drive';$('#feedback').hidden=true;choices.forEach((it,lane)=>{const el=document.createElement('div');el.className='pickup'+(it.color?' color':'');el.style.left=(16.33+lane*24.67)+'%';el.innerHTML=it.color?`<span style="background:${it.color}"></span><small>${it.label}</small>`:`<span>${it.glyph}</span><small>${it.label}</small>`;$('#flight').append(el);});}
function collect(choice){if(!game||game.phase!=='drive'||game.paused)return;game.phase='feedback';const ok=game.free?!!choice:choice?.id===game.target.id;if(ok){game.correct++;game.combo++;game.bestCombo=Math.max(game.bestCombo,game.combo);}else{choice?game.wrong++:game.missed++;game.combo=0;}tone(ok?(game.combo%3===0?'combo':'correct'):'wrong');const combo=ok&&game.combo%3===0;$('#feedback').innerHTML=ok?`${combo?'✦ '+game.combo+' in a row!':'⭐ Great flying!'}<small>${game.target.label} — you found it!</small>`:`Keep trying, pilot!<small>Look for ${game.target.label}</small>`;$('#feedback').hidden=false;$('#announcement').textContent=ok?'Great flying!':'Look for '+game.target.label;if(ok){if(game.free)game.freeScore+=100+game.combo*10;speak(combo?'combo':'correct');}else speak('try-again');if(ok)celebrate(12);game.index++;game.wait=game.free?.35:1.5;document.querySelectorAll('.pickup').forEach(e=>e.remove());updateHUD();}
function updateHUD(){const r=Learning.result(game.correct,game.wrong,game.missed);$('#accuracy').textContent=r.accuracy+'%';$('#score').textContent=game.free?game.freeScore:r.score;$('#combo').textContent=game.combo+' ✦';$('#count').textContent=game.free?Math.ceil(Math.max(0,60-game.elapsedTotal))+'s':game.index+' / 10';$('#progress').style.width=(game.free?Math.min(100,game.elapsedTotal/60*100):game.index*10)+'%';}
function startFree(){world=Learning.mixed;activeMode='free';audioReady();level=1;const plan=Learning.plan(world,1,'preschool');plan.seconds=2.4;game={plan,index:0,correct:0,wrong:0,missed:0,combo:0,bestCombo:0,lane:1,paused:false,phase:'drive',wait:0,elapsed:0,elapsedTotal:0,freeScore:0,free:true,choices:[],target:plan.targets[0]};setScreen('race');main.innerHTML=`<section class="game-shell"><div class="game-top"><button class="iconbtn" id="quit">←</button><div><b>Free Flight</b><small>Explore five sky collections · 60 seconds</small></div><button class="iconbtn" id="pause">Ⅱ</button></div><div class="hud"><div>COLLECTED<b id="accuracy">0</b></div><div>FLIGHT POINTS<b id="score">0</b></div><div>COMBO<b id="combo">0 ✦</b></div><div>TIME<b id="count">60s</b></div></div><div class="objective"><div class="target-glyph" id="targetGlyph">🛩️</div><div><p id="targetHint">FREE FLIGHT · PICK ANY OBJECT</p><strong id="targetLabel">Explore the skies!</strong></div></div><div class="flight" id="flight"><div class="flight-path"></div><div class="player" id="player"><span class="craft">${aircraft().glyph}</span></div><div class="feedback" id="feedback" hidden></div></div><div class="progress-line"><i id="progress"></i></div><div class="controls"><button id="left">←</button><p>Steer to collect anything you like</p><button id="right">→</button></div></section>`;$('#left').onclick=()=>steer(game.lane-1);$('#right').onclick=()=>steer(game.lane+1);$('#pause').onclick=pause;$('#quit').onclick=()=>pause(true);prompt();spawn();}
function finishFree(){const points=game.freeScore,count=game.correct;game=null;setScreen('result');main.innerHTML=`<section class="result panel"><div class="result-art">🛬</div><h1>What a lovely flight!</h1><p>You collected ${count} discoveries and earned ${points} flight points.</p><div class="btnrow"><button class="btn primary" id="again">Fly again →</button><button class="btn" id="homeButton">Home</button></div></section>`;$('#again').onclick=startFree;$('#homeButton').onclick=home;tone('win');celebrate(35);}
function tick(time){const dt=Math.min(.05,(time-lastTime)/1000||0);lastTime=time;if(game&&screen==='race'&&!game.paused){if(game.free&&game.elapsedTotal>=60)finishFree();else if(game.phase==='drive'){game.elapsed+=dt;if(game.free)game.elapsedTotal+=dt;const p=game.elapsed*(save.slow?1/1.5:1)/game.plan.seconds;document.querySelectorAll('.pickup').forEach(e=>e.style.top=(-20+p*86)+'%');if(p>=1)collect(game.choices[game.lane]);}else{game.wait-=dt;if(game.wait<=0){if(game.phase==='feedback'){if(game.free&&game.elapsedTotal>=60)finishFree();else if(game.free){game.phase='drive';spawn();}else if(game.index>=10)finish();else{game.phase='prompt';game.wait=2.5;$('#feedback').innerHTML='Next discovery!<small>Listen and look for your new target</small>';prompt();}}else spawn();}}}requestAnimationFrame(tick);}
function pause(leaving=false){if(!game||screen!=='race')return;game.paused=true;silence();audioContext?.suspend();$('#flight').classList.add('paused');modal.innerHTML=`<h2>${leaving?'Ready to land?':'A little landing break'}</h2><p>Your flight is paused. Come back when you're ready.</p><div class="btnrow"><button class="btn primary" id="resume">Keep flying →</button><button class="btn" id="exit">Leave flight</button></div><p class="notice">Completed missions stay saved. Leaving restarts this mission.</p>`;if(!modal.open)modal.showModal();$('#resume').onclick=resume;$('#exit').onclick=()=>{const free=game?.free;modal.close();free?home():levels();};}
function resume(){modal.close();if(!game)return;game.paused=false;audioReady();$('#flight').classList.remove('paused');speak(targetAudio());}
modal.addEventListener('cancel',e=>{e.preventDefault();if(game&&screen==='race')resume();else modal.close();});
function finish(){const r=Learning.result(game.correct,game.wrong,game.missed,activeMode),best=progress()[key()],combo=game.bestCombo,correct=game.correct;progress()[key()]={stars:Math.max(best?.stars||0,r.stars),score:Math.max(best?.score||0,r.score)};persist();setScreen('result');main.innerHTML=`<section class="result panel"><div class="eyebrow">${world.name} · Mission ${level}</div><div class="result-art">${r.stars?'🏆':'🌱'}</div><h1>${r.stars===3?'You’re a sky superstar!':r.stars?'Look how far you’ve flown!':'Every try helps you grow!'}</h1><div class="stars">${'★'.repeat(r.stars)}${'☆'.repeat(3-r.stars)}</div><p>${r.stars?'A little courage. A lot of discovery.':'Let’s practice this flight again. Follow the clue and find the matching sky object.'}</p><div class="stat-grid"><div><b>${r.accuracy}%</b>Accuracy</div><div><b>${r.score}</b>Score</div><div><b>${combo}</b>Best combo</div></div><p class="notice">${correct} correct out of 10 targets · Accuracy includes missed and wrong choices.</p><div class="btnrow">${r.stars&&level<60?'<button class="btn primary" id="next">Next flight →</button>':''}<button class="btn secondary" id="again">↻ Fly again</button><button class="btn" id="map">Flight map</button></div></section>`;$('#again').onclick=()=>start(level);$('#map').onclick=levels;if($('#next'))$('#next').onclick=()=>start(level+1);tone('win');speak(r.stars?'finish':'try-again');celebrate(r.stars?65:15);}
function celebrate(n){if(matchMedia('(prefers-reduced-motion: reduce)').matches)return;for(let i=0;i<n;i++){const p=document.createElement('i');p.style.cssText=`left:${Math.random()*100}%;background:${['#ffd76e','#ff8fb1','#83d5f4','#9be3bd','#bba5f5'][i%5]};animation-delay:${Math.random()*.5}s`;$('#confetti').append(p);setTimeout(()=>p.remove(),2600);}}
function settings(){game=null;setScreen('settings');main.innerHTML=`<button class="back" id="back">← Home</button><div class="pagehead"><h1>Your flight controls</h1><p>Make every sky adventure feel just right.</p></div><div class="panel">${[['sound','Happy sounds','Chimes and little celebration notes.'],['voice','Spoken clues','English voice prompts; system speech fills any missing clip.'],['slow','Gentle flying','Extra time to look, listen, and steer.']].map(([id,label,desc])=>`<label class="setting"><span><b>${label}</b><small>${desc}</small></span><input type="checkbox" id="${id}" ${save[id]?'checked':''}></label>`).join('')}<h3>Stars &amp; progress</h3><p class="notice">Every flight has 10 targets. Accuracy is correct targets divided by all targets, including wrong or missed ones. Best stars and scores stay saved on this device.</p><h3>Privacy &amp; offline play</h3><p class="notice">No ads, accounts or tracking. Your aircraft, settings, and progress stay on this device. The Android game is packaged to work offline.</p><p class="notice">Flying: Learn &amp; Fun · Little Flyers 3+ · Pilot Challenge 7+ · Space Flyers 13+.</p></div>`;$('#back').onclick=home;['sound','voice','slow'].forEach(id=>$('#'+id).onchange=e=>{save[id]=e.target.checked;persist();});}
function steerKey(e){if(screen==='race'&&!modal.open){if(e.key==='ArrowLeft'||e.key==='a'){e.preventDefault();steer(game.lane-1);}if(e.key==='ArrowRight'||e.key==='d'){e.preventDefault();steer(game.lane+1);}if(e.key==='Escape'||e.key===' '){e.preventDefault();pause();}}}
window.gameBack=()=>{if(modal.open){if(game&&screen==='race')resume();else modal.close();return true;}if(screen==='race'){pause(true);return true;}if(screen==='home')return false;if(screen==='result'){levels();return true;}home();return true;};
window.pauseGame=()=>{if(screen==='race'&&game&&!game.paused)pause();else silence();};
document.addEventListener('visibilitychange',()=>{if(document.hidden)window.pauseGame();});window.addEventListener('blur',()=>{if(screen==='race')window.pauseGame();});document.addEventListener('keydown',steerKey);
$('#brand').onclick=()=>screen==='race'?pause(true):home();$('#settingsButton').onclick=()=>screen==='race'?pause(true):settings();home();requestAnimationFrame(tick);</script></body></html>
